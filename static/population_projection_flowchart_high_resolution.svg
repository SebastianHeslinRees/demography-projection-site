<svg xmlns="http://www.w3.org/2000/svg" width="3416" height="3428" viewBox="0 0 1708 1714" role="img" aria-labelledby="title desc">
  <title id="title">Population projection process flowchart</title>
  <desc id="desc">Flowchart showing fertility, mortality and migration rates, starting population, calculation of components, births deaths and migration flows, age-on population and added components, population one year later, and setting the new starting population.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18"/>
    </filter>
    
    <style>
      .box-blue { fill:#169dcc; stroke:#111; stroke-width:2.5; }
      .box-purple { fill:#a52a97; stroke:#111; stroke-width:2.5; }
      .label { fill:white; font-family:Arial, Helvetica, sans-serif; font-size:31px; font-weight:400; text-anchor:middle; }
      .arrow { fill:none; stroke:#f1742f; stroke-width:34; stroke-linecap:square; stroke-linejoin:miter;; }
      .border { fill:#fff; stroke:#e4e7e9; stroke-width:2; }
    </style>
  </defs>

  <!-- clean white page -->
  <rect class="border" x="8" y="8" width="1692" height="1698" rx="20"/>

  <!-- TOP LEFT -->
  <rect class="box-blue" x="17" y="21" width="500" height="270" rx="42"/>
  <text class="label" x="267" y="101">
    <tspan x="267" dy="0">Fertility,</tspan>
    <tspan x="267" dy="45">mortality, and</tspan>
    <tspan x="267" dy="45">migration rates</tspan>
  </text>

  <!-- TOP CENTRE -->
  <rect class="box-blue" x="602" y="21" width="529" height="270" rx="42"/>
  <text class="label" x="866.5" y="103">
    <tspan x="866.5" dy="0">Starting</tspan>
    <tspan x="866.5" dy="45">population</tspan>
  </text>

  <!-- LEFT DOWN ARROW -->
  <path class="arrow" d="M267 320 L267 397"/>

  <!-- CALCULATE COMPONENTS -->
  <rect class="box-purple" x="60" y="506" width="453" height="265"/>
  <text class="label" x="286.5" y="592">
    <tspan x="286.5" dy="0">Calculate</tspan>
    <tspan x="286.5" dy="45">components</tspan>
  </text>

  <!-- arrow from calculate to births -->
  <path class="arrow" d="M286 806 L286 884"/>

  <!-- BIRTHS DEATHS MIGRATION -->
  <rect class="box-blue" x="20" y="1002" width="525" height="266" rx="42"/>
  <text class="label" x="282.5" y="1086">
    <tspan x="282.5" dy="0">Births, deaths,</tspan>
    <tspan x="282.5" dy="45">migration flows</tspan>
  </text>

  <!-- arrow births -> age-on -->
  <path class="arrow" d="M584 1134 L682 1134"/>

  <!-- STARTING POPULATION down arrow -->
  <path class="arrow" d="M866 319 L866 871"/>

  <!-- curved arrow starting population -> calculate -->
  <path class="arrow" d="M778 320 L778 535 Q778 586 728 586 L592 586"/>

  <!-- AGE-ON -->
  <rect class="box-purple" x="715" y="1000" width="447" height="270"/>
  <text class="label" x="938.5" y="1067">
    <tspan x="938.5" dy="0">Age-on</tspan>
    <tspan x="938.5" dy="42">population</tspan>
    <tspan x="938.5" dy="42">and add</tspan>
    <tspan x="938.5" dy="42">components</tspan>
  </text>

  <!-- age-on -> population 1 year later -->
  <path class="arrow" d="M938 1302 L938 1391"/>

  <!-- POPULATION ONE YEAR LATER -->
  <rect class="box-blue" x="685" y="1444" width="475" height="250" rx="42"/>
  <text class="label" x="922.5" y="1527">
    <tspan x="922.5" dy="0">Population</tspan>
    <tspan x="922.5" dy="45">1-year later</tspan>
  </text>

  <!-- RIGHT SET NEW STARTING POPULATION -->
  <rect class="box-purple" x="1251" y="697" width="449" height="266"/>
  <text class="label" x="1475.5" y="766">
    <tspan x="1475.5" dy="0">Set as new</tspan>
    <tspan x="1475.5" dy="45">starting</tspan>
    <tspan x="1475.5" dy="45">population</tspan>
  </text>

  <!-- population later -> set new starting -->
  <path class="arrow" d="M1210 1578 L1330 1578 Q1472 1578 1472 1435 L1472 1017"/>

  <!-- set new starting -> starting population -->
  <path class="arrow" d="M1472 656 L1472 400 Q1472 144 1237 144 L1180 144"/>

  <!-- arrowheads -->
  <g fill="#f1742f">
    <polygon points="239,397 295,397 267,438"/>
    <polygon points="258,884 314,884 286,925"/>
    <polygon points="682,1106 682,1162 723,1134"/>
    <polygon points="838,871 894,871 866,912"/>
    <polygon points="592,558 592,614 551,586"/>
    <polygon points="910,1391 966,1391 938,1432"/>
    <polygon points="1444,1017 1500,1017 1472,976"/>
    <polygon points="1180,116 1180,172 1139,144"/>
  </g>
</svg>
